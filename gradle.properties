org.gradle.jvmargs=-Xmx8g -Xms2g -Dfile.encoding=UTF-8
kotlin.daemon.jvm.options=-Xmx4g,-Xms512m,-XX:MaxMetaspaceSize=1g
# Optimisé pour macOS - évite le GC thrashing
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.daemon.performance.disable-logging=false
org.gradle.workers.max=4
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# KSP2 casse la generation Hilt (voir https://github.com/google/dagger/issues/4266)
ksp.useKSP2=false

# Surcharge locale possible : LOOBY_API_BASE_URL=https://localhost:7001
LOOBY_API_BASE_URL=https://looby.fr
# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
