org.gradle.jvmargs=-Xmx6g -Xms1g -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=1g
kotlin.daemon.jvm.options=-Xmx3g,-Xms256m,-XX:MaxMetaspaceSize=768m
# Optimisé pour macOS - évite le GC thrashing et l'OOM sur mergeDex/mergeResources
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.daemon.performance.disable-logging=false
org.gradle.workers.max=2
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# KSP2 casse la generation Hilt (voir https://github.com/google/dagger/issues/4266)
ksp.useKSP2=false

# Surcharge locale possible : LOOBY_API_BASE_URL=https://localhost:7001
LOOBY_API_BASE_URL=https://looby.fr
