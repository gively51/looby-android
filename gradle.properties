org.gradle.jvmargs=-Xmx4g -Xms512m -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=512m
kotlin.daemon.jvmargs=-Xmx1536m -Xms256m -XX:MaxMetaspaceSize=512m
# Optimisé pour Mac 12 Go de RAM - évite le GC thrashing et l'OOM sur mergeDex/mergeResources
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configuration-cache=false
org.gradle.daemon.performance.disable-logging=false
org.gradle.workers.max=1
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# KSP2 casse la generation Hilt (voir https://github.com/google/dagger/issues/4266)
ksp.useKSP2=false
# material-icons-extended est tres volumineuse ; la transformation de dexing par artefact
# alloue un worker isole par AAR et provoque un OOM sur les machines a faible RAM.
# On desactive cette transformation pour utiliser le merge dex classique (moins de pics memoire).
android.enableDexingArtifactTransform=false

# Surcharge locale possible : LOOBY_API_BASE_URL=https://localhost:7001
LOOBY_API_BASE_URL=https://looby.fr
